[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "software-world-model"
version = "0.1.0"
description = "Benchmark for computer-use agents on self-hosted business software, verified by whole-database diffs: success, collateral damage, irreversible changes, false completion."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shubham Joshi" }]
requires-python = ">=3.10,<3.13"  # browsergym-core 0.14 pins playwright 1.44, which has no 3.13 build
keywords = ["computer-use", "agents", "benchmark", "evaluation", "browsergym", "odoo", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "browsergym-core>=0.14,<0.15",
  "openai>=1.40",
  "pymysql>=1.1",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "pillow>=10",
  "matplotlib>=3.8",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Track 2 (latent dynamics probe) only
track2 = ["torch>=2.2", "transformers>=4.40", "sentence-transformers>=3.0"]
dev = ["pytest>=8"]

[project.scripts]
swm = "swm.cli:main"

[project.urls]
Homepage = "https://github.com/shubhamjoshipromail-svg/software-world-model"
Issues = "https://github.com/shubhamjoshipromail-svg/software-world-model/issues"

[tool.setuptools.packages.find]
include = ["swm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
