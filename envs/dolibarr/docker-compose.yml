services:
  db:
    logging: {driver: "none"}
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports: ["127.0.0.1:33064:3306"]
    command: ["--skip-log-bin"]
    tmpfs: ["/var/lib/mysql:size=1200m"]
  web:
    logging: {driver: "none"}
    image: dolibarr/dolibarr:22
    depends_on: [db]
    environment:
      DOLI_DB_HOST: db
      DOLI_DB_NAME: ${MYSQL_DATABASE}
      DOLI_DB_USER: ${MYSQL_USER}
      DOLI_DB_PASSWORD: ${MYSQL_PASSWORD}
      DOLI_URL_ROOT: http://localhost:8015
      DOLI_ADMIN_LOGIN: ${DOLI_ADMIN_LOGIN}
      DOLI_ADMIN_PASSWORD: ${DOLI_ADMIN_PASSWORD}
      DOLI_INSTANCE_UNIQUE_ID: ${DOLI_INSTANCE_UNIQUE_ID}
      DOLI_INIT_DEMO: 0
      DOLI_COMPANY_NAME: SwmBookkeeping
      DOLI_COMPANY_COUNTRYCODE: US
      DOLI_ENABLE_MODULES: Societe,Facture,Product,Service,Banque,Api
      DOLI_CRON: 0
      PHP_INI_DATE_TIMEZONE: America/Los_Angeles
    ports: ["127.0.0.1:8015:80"]
    volumes: [docs:/var/www/documents]
volumes:
  db:
  docs:
